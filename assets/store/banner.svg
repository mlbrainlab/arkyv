<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" width="1920" height="640">
  <title>Arkyv — Snap Store banner (background and text)</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2338"/>
      <stop offset="1" stop-color="#0F1115"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#4A65F0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4A65F0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#glow)"/>
  <image href="arkyv-icon-dark-512.png" x="120" y="150" width="150" height="150"/>
  <text x="300" y="262" font-family="Crate Inter" font-weight="700" font-size="104" fill="#F1F4F9" letter-spacing="-2">Arkyv</text>
  <text x="122" y="390" font-family="Crate Inter" font-weight="500" font-size="46" fill="#E7EAF0">Open, extract and create archives</text>
  <text x="122" y="452" font-family="Crate Inter" font-weight="400" font-size="30" fill="#A9B0BD">ZIP · 7z · RAR · TAR · and more. Free and open source.</text>
</svg>
